<style>
html,body{margin:0;padding:0;height:100%;}
body{display:flex;align-items:center;justify-content:center;background:#f7f4ee;color:#1c1917;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;}
#lock{width:min(92vw,360px);background:#fffcf7;border:1px solid rgba(28,25,23,.1);border-radius:16px;padding:28px 24px;box-shadow:0 16px 48px rgba(28,25,23,.1);}

button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:#1c1917;color:#fffcf7;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;}
button:disabled{opacity:.5;cursor:default;}
#msg{margin:12px 0 0;font-size:13px;min-height:18px;color:#c23b2e;}
#msg.ok{color:#5a8f6b;}
</style>

var b64d=function(s){var b=atob(s),n=b.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=b.charCodeAt(i);return u;};
var enc=new TextEncoder();
async function unlock(pw){
  var base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(SALT),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(IV)},key,b64d(CT));
  return new TextDecoder().decode(pt);
}

form.addEventListener("submit",async function(e){
  e.preventDefault();
  var pw=document.getElementById("p").value;
  if(!pw){msg.className="";msg.textContent="请输入密码";return;}
  if(!(window.crypto&&crypto.subtle)){msg.textContent="当前环境不支持解密，请用现代浏览器本地打开";return;}

    if(m&&m[1].trim())document.title=m[1].trim();
    var fr=document.createElement("iframe");
    fr.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff";
    fr.setAttribute("title","content");
    document.body.replaceChildren(fr);
    fr.srcdoc=html;
  }catch(err){

    btn.disabled=false;
